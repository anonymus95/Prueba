<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normalizador de Direcciones - Luker</title>
    <!-- Cargamos la librería para manejar archivos Excel (XLSX / SheetJS) de forma inmediata -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            color: #333333;
            margin-bottom: 10px;
        }
        p {
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .file-drop-area {
            border: 2px dashed #cccccc;
            border-radius: 6px;
            padding: 25px;
            background-color: #fafafa;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .file-drop-area:hover {
            background-color: #eaeaea;
        }
        .file-input {
            display: none;
        }
        .file-msg {
            font-weight: 500;
            color: #555555;
        }
        .btn-procesar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-procesar:hover {
            background-color: #218838;
        }
        .btn-procesar:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .output-area {
            margin-top: 25px;
            text-align: left;
            font-size: 14px;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
            display: none;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .stats-table td {
            padding: 6px 0;
            color: #444444;
        }
        .stats-table td:last-child {
            text-align: right;
            font-weight: bold;
        }
        .error-msg {
            color: #dc3545;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Normalizador de Direcciones - Luker</h2>
    <p>1. Selecciona tu archivo Excel (.xlsx)<br>2. Presiona 'Procesar y Descargar' para limpiar las direcciones.</p>
    
    <div class="file-drop-area" id="drop-area">
        <span class="file-msg" id="file-msg">📁 Haz clic aquí para buscar tu Excel</span>
        <input class="file-input" type="file" id="file-input" accept=".xlsx">
    </div>
    
    <button class="btn-procesar" id="btn-procesar" disabled>⚙️ Procesar y Descargar</button>
    
    <div class="output-area" id="output-area"></div>
</div>

<script>
// --- TRADUCCIÓN EXACTA DE TU LÓGICA DE PYTHON ---

function normalizarCaracteresEspeciales(texto) {
    if (typeof texto !== 'string') return "";
    
    // Protección de Ñ y ñ
    let protegido = texto.replace(/Ñ/g, '[[MAY_N_TILDE]]').replace(/ñ/g, '[[MIN_N_TILDE]]');
    
    // Eliminar caracteres residuales como Â o â
    protegido = protegido.replace(/[Ââ]/g, (m) => m === m.toUpperCase() ? 'A' : 'a');
    
    // Descomponer Unicode para quitar tildes/diacríticos manteniendo la base
    let nfkd = protegido.normalize('NFKD');
    let sinDiacriticos = nfkd.replace(/[\u0300-\u036f]/g, "");
    
    // Restaurar Ñ y ñ
    return sinDiacriticos.replace(/\[\[MAY_N_TILDE\]\]/g, 'Ñ').replace(/\[\[MIN_N_TILDE\]\]/g, 'ñ');
}

function normalizarDireccion(direccion) {
    if (direccion === null || direccion === undefined || String(direccion).trim() === "") {
        return "";
    }
    
    let texto = String(direccion);
    
    // 1. Tratamiento de todos los espacios en blanco Unicode
    let textoEspacios = texto.replace(/\s+/g, ' ');
    
    // 2. Quitar tildes preservando la Ñ
    let textoNormalizado = normalizarCaracteresEspeciales(textoEspacios);
    
    // 3. TU MEJORA CRÍTICA: Reemplazar caracteres NO permitidos por un espacio ' '
    let textoFiltrado = textoNormalizado.replace(/[^A-Za-zÑñ0-9 #\-]/g, ' ');
    
    // 4. Limpieza final de dobles espacios generados por los reemplazos
    let textoFinal = textoFiltrado.replace(/ {2,}/g, ' ');
    return textoFinal.trim();
}

// --- CONTROL DE LA INTERFAZ WEB ---

const dropArea = document.getElementById('drop-area');
const fileInput = document.getElementById('file-input');
const fileMsg = document.getElementById('file-msg');
const btnProcesar = document.getElementById('btn-procesar');
const outputArea = document.getElementById('output-area');

let archivoCargado = null;
let nombreOriginal = "";

dropArea.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
        archivoCargado = e.target.files[0];
        nombreOriginal = archivoCargado.name;
        fileMsg.innerText = `📄 ${nombreOriginal}`;
        btnProcesar.disabled = false;
        outputArea.style.display = 'none';
    }
});

btnProcesar.addEventListener('click', function() {
    if (!archivoCargado) return;
    
    outputArea.innerHTML = "⏳ Procesando datos en tu navegador, espera un momento...";
    outputArea.style.display = 'block';
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', raw: false});
            
            // Tomamos la primera hoja del Excel
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            
            // Convertimos a JSON manteniendo todo como texto puro para proteger formatos
            const filas = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
            
            if (filas.length === 0) {
                outputArea.innerHTML = "<span class='error-msg'>❌ El archivo Excel está vacío.</span>";
                return;
            }
            
            // Validar si existe la columna requerida
            const columnas = Object.keys(filas[0]);
            if (!columnas.includes('Direccion')) {
                outputArea.innerHTML = `<span class='error-msg'>❌ [ERROR] No se encontró la columna exacta 'Direccion'.</span><br><br>Columnas detectadas: ${columnas.join(', ')}`;
                return;
            }
            
            // Inicializar contadores de tus Estadísticas
            let totalRegistros = filas.length;
            let direccionesVacias = 0;
            let mismasDirecciones = 0;
            let modificadasDirecciones = 0;
            
            // Procesar fila por fila
            const filasProcesadas = filas.map(fila => {
                let orig = String(fila['Direccion'] || "").trim();
                let ajust = normalizarDireccion(fila['Direccion']);
                
                fila['Direccion ajustada'] = ajust;
                
                if (orig === "" && ajust === "") {
                    direccionesVacias++;
                } else if (orig === ajust) {
                    mismasDirecciones++;
                } else {
                    modificadasDirecciones++;
                }
                return fila;
            });
            
            // Crear el nuevo Excel resultante
            const nuevaHoja = XLSX.utils.json_to_sheet(filasProcesadas);
            const nuevoWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(nuevoWorkbook, nuevaHoja, sheetName);
            
            // Generar descarga inmediata y directa en el navegador
            let nombreSalida = nombreOriginal.replace(".xlsx", "_ajustado.xlsx");
            if (nombreSalida === nombreOriginal) nombreSalida = "direcciones_ajustadas.xlsx";
            
            XLSX.writeFile(nuevoWorkbook, nombreSalida);
            
            // Pintar la tabla de estadísticas exacta que tenías en Python
            outputArea.innerHTML = `
                <div style="font-weight:bold; text-align:center; margin-bottom:10px; color:#28a745;">✅ ¡PROCESO COMPLETADO EXITOSAMENTE!</div>
                <div style="text-align:center; margin-bottom:15px; font-size:12px; color:#777;">El archivo se descargó automáticamente.</div>
                <strong>=============================================</strong><br>
                <strong style="display:block; text-align:center;">ESTADÍSTICAS DEL PROCESO</strong>
                <strong>=============================================</strong>
                <table class="stats-table">
                    <tr><td>Nombre del archivo original:</td><td>${nombreOriginal}</td></tr>
                    <tr><td>Cantidad total de registros:</td><td>${totalRegistros}</td></tr>
                    <tr><td>Direcciones modificadas:</td><td>${modificadasDirecciones}</td></tr>
                    <tr><td>Direcciones sin cambios:</td><td>${mismasDirecciones}</td></tr>
                    <tr><td>Direcciones vacías o nulas:</td><td>${direccionesVacias}</td></tr>
